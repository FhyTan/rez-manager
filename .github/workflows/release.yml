name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest

  release:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Build executables
        run: .\build_scripts\build.bat

      - name: Archive release bundle
        shell: pwsh
        run: |
          $archiveName = "rez-manager-${{ github.ref_name }}-windows.zip"
          Compress-Archive -Path "build/rez-manager.dist/*" -DestinationPath $archiveName -Force

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: rez-manager-${{ github.ref_name }}-windows.zip
